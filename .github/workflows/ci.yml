name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # nightly at 02:00 UTC

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      STELLAR_NETWORK: testnet
      SMTP_HOST: ""
      SKIP_CONTRACT_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Install dependencies
        run: npm install

      # Jest only loads modules a test touches and mocks hide syntax errors, so parse every source file.
      - name: Syntax check backend sources
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Lint backend for duplicate/unreachable code
        run: >-
          npx eslint src --no-eslintrc --parser-options ecmaVersion:latest
          --env node,es2021
          --rule '{"no-dupe-keys":"error","no-redeclare":"error","no-unreachable":"error","no-dupe-class-members":"error"}'

      # Boots the real server (in-memory SQLite) so import-time failures in any module surface here.
      - name: Boot server and poll health
        env:
          PORT: 4000
          SQLITE_PATH: ':memory:'
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          SOROBAN_ESCROW_CONTRACT_ID: ci-placeholder
          SOROBAN_XLM_TOKEN_CONTRACT_ID: ci-placeholder
        run: |
          node src/index.js > "$RUNNER_TEMP/boot.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Server exited during boot"; cat "$RUNNER_TEMP/boot.log"; exit 1
            fi
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/v1/health)" = "200" ]; then
              echo "Health check returned 200"
              kill "$pid"
              exit 0
            fi
            sleep 1
          done
          echo "Health check did not return 200 within 30s"; cat "$RUNNER_TEMP/boot.log"
          kill "$pid"
          exit 1

      - name: Run tests with coverage
        run: npm run test:coverage

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30

  frontend-bundle-size:
    name: Frontend Bundle Size Budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size budgets
        # BUNDLE_INITIAL_BUDGET_KB: max KiB for vendor+index (initial load, uncompressed)
        # BUNDLE_TOTAL_BUDGET_KB:   max KiB for all JS chunks combined (uncompressed)
        # Raise these intentionally and document the reason — never bump silently.
        env:
          BUNDLE_INITIAL_BUDGET_KB: 500
          BUNDLE_TOTAL_BUDGET_KB: 5000
        run: node scripts/check-bundle-size.js

      - name: Upload bundle size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle-size
          path: frontend/dist/assets/*.js
          retention-days: 30

  smoke-test-testnet:
    name: Escrow Testnet Smoke Test
    # Only on merges to main — this touches live Stellar Testnet, not on every PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    env:
      ORDER_ID: ${{ github.run_id }}
      STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'

  soroban-contracts:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Check EscrowError codes (NEXT_CODE, no reuse, README table)
        run: bash scripts/check-escrow-error-codes.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('contracts/Cargo.lock', 'contracts/Cargo.toml', 'contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-contracts-

      - name: Run escrow tests
        run: cargo test -p soroban-escrow --lib

      - name: Run creator-earnings tests
        run: cargo test -p creator-earnings --features testutils

      - name: Profile contracts WASM binary sizes
        run: bash wasm-profile.sh | tee contracts-wasm-profile.txt

      - name: Upload contracts size report
        uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm-size-profile
          path: contracts/contracts-wasm-profile.txt
          retention-days: 30

  contracts:
    name: Contracts (fmt, clippy, test, wasm)
    # Runs on every PR and push to main so non-compiling contract code can't land (#1286).
    # The legacy `contract/` crate is deprecated (see ADR 0002) and is intentionally
    # excluded from this matrix; only the actively developed `contracts/` workspace is built.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SDK =22.0.0 workspace
          - name: contracts-workspace
            dir: contracts
            sdk: sdk22
            # test-utils is a workspace member (fmt/clippy/test) but ships no WASM
            wasm: soroban_escrow creator_earnings
          # Legacy SDK =21.x crates, each with its own manifest
          - name: contract-escrow
            dir: contract
            sdk: sdk21
            wasm: escrow
          - name: contract-reward-token
            dir: contract/reward-token
            sdk: sdk21
            wasm: reward_token
          - name: contract-carbon-offset
            dir: contract/carbon-offset
            sdk: sdk21
            wasm: carbon_offset
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.dir }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.sdk }}-${{ matrix.name }}-${{ hashFiles(format('{0}/**/Cargo.toml', matrix.dir), format('{0}/**/Cargo.lock', matrix.dir)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.sdk }}-${{ matrix.name }}-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Build release WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v22.8.1

      - name: Optimise WASM and enforce 64 KB limit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wasm-out"
          : > "$GITHUB_WORKSPACE/wasm-out/sizes-${{ matrix.name }}.tsv"
          fail=0
          for w in ${{ matrix.wasm }}; do
            src="target/wasm32-unknown-unknown/release/$w.wasm"
            out="$GITHUB_WORKSPACE/wasm-out/$w.optimized.wasm"
            stellar contract optimize --wasm "$src" --wasm-out "$out"
            cp "$src" "$GITHUB_WORKSPACE/wasm-out/"
            size=$(stat -c%s "$out")
            printf '%s\t%s\n' "$w" "$size" >> "$GITHUB_WORKSPACE/wasm-out/sizes-${{ matrix.name }}.tsv"
            if [ "$size" -gt 65536 ]; then
              echo "::error::$w optimised WASM is $size bytes (> 64 KB limit)"; fail=1
            fi
          done
          exit $fail

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.name }}
          path: |
            wasm-out/*.wasm
            wasm-out/*.tsv
          retention-days: 30

      - name: Check escrow error codes
        if: matrix.name == 'contracts-workspace'
        working-directory: .
        run: bash contracts/scripts/check-escrow-error-codes.sh

      - name: Check WASM hashes against registry
        # Needs the deployment registry DB; skipped (with a notice) when the secret is unavailable, e.g. on fork PRs.
        if: matrix.name == 'contracts-workspace'
        working-directory: .
        env:
          DATABASE_URL: ${{ secrets.CONTRACTS_REGISTRY_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::notice::CONTRACTS_REGISTRY_DATABASE_URL not set; skipping check-wasm-hashes.sh"
            exit 0
          fi
          sudo apt-get install -y postgresql-client >/dev/null
          bash contracts/scripts/check-wasm-hashes.sh

  wasm-size-report:
    name: WASM size diff
    needs: contracts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wasm-*
          path: head
          merge-multiple: true

      - name: Download baseline sizes from main
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: ci.yml
          branch: main
          name: wasm-.*
          name_is_regexp: true
          path: base
          if_no_artifact_found: ignore

      - name: Build size diff table
        run: |
          cat head/sizes-*.tsv | sort > head.tsv
          find base -name 'sizes-*.tsv' -exec cat {} + 2>/dev/null | sort > base.tsv || true
          {
            echo '<!-- wasm-size-report -->'
            echo '### Optimised WASM sizes (limit 64 KB)'
            echo '| Contract | main | PR | Δ |'
            echo '|---|---:|---:|---:|'
            while IFS=$'\t' read -r name size; do
              b=$(awk -F'\t' -v n="$name" '$1==n{print $2}' base.tsv)
              if [ -n "$b" ]; then d=$((size - b)); else b='—'; d='new'; fi
              echo "| \`$name\` | $b | $size | $d |"
            done < head.tsv
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: wasm-size-report
          path: comment.md

  contract-tests-nightly:
    name: Contract Tests (nightly, Docker)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: backend
    services:
      stellar:
        image: stellar/quickstart:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -sf http://localhost:8000/friendbot || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      STELLAR_NETWORK: testnet
      TEST_HORIZON_URL: http://localhost:8000
      TEST_SOROBAN_RPC_URL: http://localhost:8000/soroban/rpc
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run contract tests
        run: npm run test:contracts

  wasm-size-profile:
    name: WASM Size Profile (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            contracts/escrow/target
          key: ${{ runner.os }}-escrow-smoke-${{ hashFiles('contracts/escrow/Cargo.lock') }}

      - name: Install Stellar CLI
        run: command -v stellar >/dev/null || cargo install --locked stellar-cli

      - name: Run smoke test (deposit -> release -> verify Horizon event)
        run: ./cli.sh smoke-test
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
            contracts/target
          key: ${{ runner.os }}-cargo-wasm-profile-${{ hashFiles('contract/Cargo.toml', 'contract/reward-token/Cargo.toml', 'contracts/Cargo.lock', 'contracts/Cargo.toml', 'contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-profile-

      - name: Profile legacy contract WASM binary sizes
        run: bash contract/wasm-profile.sh | tee legacy-wasm-profile.txt

      - name: Profile workspace contract WASM binary sizes
        run: bash contracts/wasm-profile.sh | tee contracts-wasm-profile.txt

      - name: Write job summary
        run: |
          echo "## WASM Binary Size Profile" >> "$GITHUB_STEP_SUMMARY"
          echo "### Legacy contract/" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          cat legacy-wasm-profile.txt >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "### Workspace contracts/" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          cat contracts-wasm-profile.txt >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-profile
          path: |
            legacy-wasm-profile.txt
            contracts-wasm-profile.txt
          retention-days: 30
